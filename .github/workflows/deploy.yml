name: Deploy Garden
on:
  schedule:
    - cron: "17 9 * * *"
  # This adds the manual button
  workflow_dispatch:
  push:
    branches:
      - v4
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Update Chess.com rating history
        run: |
          node scripts/update-chess-ratings.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quartz/static/chess-ratings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Chess.com rating history"
            git push
          fi

      - name: Build Quartz
        run: npx quartz build

      - name: Verify the public garden content is present
        run: test -s content/index.md

      - name: Deploy to Oracle
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.ORACLE_IP }}
          REMOTE_USER: "ubuntu"
          TARGET: "/var/www/garden/"
          SOURCE: "public/"
          ARGS: "-rltgoDzvO --delete"
